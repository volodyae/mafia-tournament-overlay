<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админ-панель Мафии</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .login-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .login-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
            text-align: center;
        }

        .login-error.visible { display: block; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1>🏆 Мафия</h1>
            <p class="subtitle">Вход в админ-панель</p>

            <div class="login-error" id="loginError"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Логин:</label>
                    <input type="text" id="username" class="form-input" placeholder="Введите логин" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="password" class="form-input" placeholder="Введите пароль" required autocomplete="current-password">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
                </div>
            </form>
        </div>
    </div>

<script src="/config.js"></script>
<script src="js/api.js"></script>
<script>
    // Если уже залогинен — редиректим
    if (API.isLoggedIn()) {
        window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('loginError');
        errorDiv.classList.remove('visible');

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            await API.login(username, password);
            window.location.href = 'index.html';
        } catch (error) {
            errorDiv.textContent = error.message || 'Ошибка авторизации';
            errorDiv.classList.add('visible');
        }
    });
</script>
</body>
</html>
