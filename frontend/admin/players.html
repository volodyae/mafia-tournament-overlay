<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База игроков</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="container">
        <!-- Навигация -->
        <nav class="navbar">
            <h1>🏆 Админ-панель Мафии</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Турниры</a>
                <a href="players.html" class="nav-link active">Игроки</a>
                <a href="users.html" class="nav-link" id="usersLink" style="display:none;">Пользователи</a>
                <span style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
                    <span id="currentUser" style="color: var(--text-secondary); font-size: 14px;"></span>
                    <a href="#" class="nav-link" id="changePassLink">🔑</a>
                    <a href="#" class="nav-link" onclick="API.logout(); return false;">Выход</a>
                </span>
            </div>
        </nav>

        <!-- Главный контент -->
        <div class="content">
            <div class="page-header">
                <h2>База игроков</h2>
                <button class="btn btn-primary" id="addPlayerBtn">
                    + Добавить игрока
                </button>
            </div>

            <!-- Поиск -->
            <div class="search-bar">
                <input type="text" id="searchInput" class="form-input" 
                       placeholder="🔍 Поиск по никнейму...">
            </div>

            <!-- Список игроков -->
            <div id="playersList" class="players-list">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления/редактирования игрока -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Добавить игрока</h3>
                <button class="close-btn" id="closePlayerModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="playerForm" enctype="multipart/form-data">
                    <input type="hidden" id="playerId">
                    
                    <div class="form-group">
                        <label>Никнейм:</label>
                        <input type="text" id="playerNickname" class="form-input" 
                               placeholder="Ник игрока" required>
                    </div>

                    <div class="form-group">
                        <label>Фотография:</label>
                        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                            <button type="button" class="btn btn-primary" id="uploadPhotoBtn" style="flex: 1;">
                                📁 Загрузить с компьютера
                            </button>
                            <button type="button" class="btn btn-secondary" id="urlPhotoBtn" style="flex: 1;">
                                🔗 Указать ссылку
                            </button>
                        </div>
                        
                        <!-- Загрузка файла -->
                        <div id="uploadPhotoBlock">
                            <input type="file" id="playerPhotoFile" class="form-input" accept="image/*">
                            <div id="photoPreview" style="margin-top: 12px; display: none;">
                                <img id="previewImage" style="max-width: 200px; border-radius: 8px;">
                            </div>
                        </div>
                        
                        <!-- Ввод URL -->
                        <div id="urlPhotoBlock" style="display: none;">
                            <input type="url" id="playerPhoto" class="form-input" 
                                   placeholder="https://example.com/photo.jpg">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelPlayerBtn">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Модальное окно смены пароля -->
    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Смена пароля</h3>
                <button class="close-btn" id="closePasswordModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label>Текущий пароль:</label>
                        <input type="password" id="currentPassword" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Новый пароль:</label>
                        <input type="password" id="newPassword" class="form-input" placeholder="Мин. 6 символов" required>
                    </div>
                    <div class="form-group">
                        <label>Повторите новый пароль:</label>
                        <input type="password" id="confirmPassword" class="form-input" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelPasswordBtn">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сменить пароль</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/players.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = API.getUser();
        const el = document.getElementById('currentUser');
        if (el && user) el.textContent = user.username;

        const usersLink = document.getElementById('usersLink');
        if (usersLink && API.isSuperadmin()) usersLink.style.display = '';

        const changePassLink = document.getElementById('changePassLink');
        if (changePassLink) {
            changePassLink.addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                document.getElementById('changePasswordModal').classList.add('active');
            });
        }

        const closeBtn = document.getElementById('closePasswordModal');
        if (closeBtn) closeBtn.addEventListener('click', () => {
            document.getElementById('changePasswordModal').classList.remove('active');
        });

        const cancelBtn = document.getElementById('cancelPasswordBtn');
        if (cancelBtn) cancelBtn.addEventListener('click', () => {
            document.getElementById('changePasswordModal').classList.remove('active');
        });

        const modal = document.getElementById('changePasswordModal');
        if (modal) modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        const form = document.getElementById('changePasswordForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const current = document.getElementById('currentPassword').value;
                const newPass = document.getElementById('newPassword').value;
                const confirmPass = document.getElementById('confirmPassword').value;

                if (newPass.length < 6) {
                    UI.showToast('Новый пароль должен быть не менее 6 символов', 'error');
                    return;
                }
                if (newPass !== confirmPass) {
                    UI.showToast('Пароли не совпадают', 'error');
                    return;
                }

                try {
                    await API.request('/auth/change-password', {
                        method: 'POST',
                        body: JSON.stringify({
                            current_password: current,
                            new_password: newPass
                        })
                    });
                    UI.showToast('Пароль успешно изменён');
                    document.getElementById('changePasswordModal').classList.remove('active');
                } catch (error) {
                    UI.showToast('Ошибка: ' + error.message, 'error');
                }
            });
        }
    });
    </script>
</body>
</html>
