<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База игроков</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="container">
        <!-- Навигация -->
        <nav class="navbar">
            <h1>🏆 Админ-панель Мафии</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Турниры</a>
                <a href="players.html" class="nav-link active">Игроки</a>
            </div>
        </nav>

        <!-- Главный контент -->
        <div class="content">
            <div class="page-header">
                <h2>База игроков</h2>
                <button class="btn btn-primary" id="addPlayerBtn">
                    + Добавить игрока
                </button>
            </div>

            <!-- Поиск -->
            <div class="search-bar">
                <input type="text" id="searchInput" class="form-input" 
                       placeholder="🔍 Поиск по никнейму...">
            </div>

            <!-- Список игроков -->
            <div id="playersList" class="players-list">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления/редактирования игрока -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Добавить игрока</h3>
                <button class="close-btn" id="closePlayerModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="playerForm" enctype="multipart/form-data">
                    <input type="hidden" id="playerId">
                    
                    <div class="form-group">
                        <label>Никнейм:</label>
                        <input type="text" id="playerNickname" class="form-input" 
                               placeholder="WellDone (BLR)" required>
                    </div>

                    <div class="form-group">
                        <label>Фотография:</label>
                        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                            <button type="button" class="btn btn-primary" id="uploadPhotoBtn" style="flex: 1;">
                                📁 Загрузить с компьютера
                            </button>
                            <button type="button" class="btn btn-secondary" id="urlPhotoBtn" style="flex: 1;">
                                🔗 Указать ссылку
                            </button>
                        </div>
                        
                        <!-- Загрузка файла -->
                        <div id="uploadPhotoBlock">
                            <input type="file" id="playerPhotoFile" class="form-input" accept="image/*">
                            <div id="photoPreview" style="margin-top: 12px; display: none;">
                                <img id="previewImage" style="max-width: 200px; border-radius: 8px;">
                            </div>
                        </div>
                        
                        <!-- Ввод URL -->
                        <div id="urlPhotoBlock" style="display: none;">
                            <input type="url" id="playerPhoto" class="form-input" 
                                   placeholder="https://example.com/photo.jpg">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelPlayerBtn">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script src="js/ui.js"></script>
<script src="/config.js"></script>
<script src="js/api.js"></script>
<script src="js/players.js"></script>

</body>
</html>
