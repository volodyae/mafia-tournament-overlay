<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Турниры</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="container">
        <!-- Навигация -->
        <nav class="navbar">
            <h1>🏆 Админ-панель Мафии</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Турниры</a>
                <a href="players.html" class="nav-link">Игроки</a>
                <a href="users.html" class="nav-link" id="usersLink" style="display:none;">Пользователи</a>
                <span style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
                    <span id="currentUser" style="color: var(--text-secondary); font-size: 14px;"></span>
                    <a href="#" class="nav-link" id="changePassLink">🔑</a>
                    <a href="#" class="nav-link" onclick="API.logout(); return false;">Выход</a>
                </span>
            </div>
        </nav>

        <!-- Главный контент -->
        <div class="content">
            <div class="page-header">
                <h2>Мои турниры</h2>
                <button class="btn btn-primary" id="createTournamentBtn">
                    + Создать турнир
                </button>
            </div>

            <!-- Список турниров -->
            <div id="tournamentsList" class="tournaments-list">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </div>

    <!-- Модальное окно создания турнира -->
    <div id="createTournamentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Создание турнира</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="createTournamentForm">
                    <div class="form-group">
                        <label>Название турнира:</label>
                        <input type="text" id="tournamentName" class="form-input" 
                               placeholder="Серия 4 - Кубок Мега" required>
                    </div>

                    <div class="form-group">
                        <label>Количество игр:</label>
                        <div class="number-input">
                            <button type="button" class="btn-minus" data-target="totalGames">-</button>
                            <input type="number" id="totalGames" class="form-input" 
                                   value="5" min="1" max="20" required>
                            <button type="button" class="btn-plus" data-target="totalGames">+</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Количество столов:</label>
                        <div class="number-input">
                            <button type="button" class="btn-minus" data-target="totalTables">-</button>
                            <input type="number" id="totalTables" class="form-input" 
                                   value="1" min="1" max="5" required>
                            <button type="button" class="btn-plus" data-target="totalTables">+</button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
                        <button type="submit" class="btn btn-primary">Создать турнир</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Модальное окно смены пароля -->
    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Смена пароля</h3>
                <button class="close-btn" id="closePasswordModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label>Текущий пароль:</label>
                        <input type="password" id="currentPassword" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Новый пароль:</label>
                        <input type="password" id="newPassword" class="form-input" placeholder="Мин. 6 символов" required>
                    </div>
                    <div class="form-group">
                        <label>Повторите новый пароль:</label>
                        <input type="password" id="confirmPassword" class="form-input" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelPasswordBtn">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сменить пароль</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/tournaments.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = API.getUser();
        const el = document.getElementById('currentUser');
        if (el && user) el.textContent = user.username;

        const usersLink = document.getElementById('usersLink');
        if (usersLink && API.isSuperadmin()) usersLink.style.display = '';

        // Кнопка смены пароля
        const changePassLink = document.getElementById('changePassLink');
        if (changePassLink) {
            changePassLink.addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                document.getElementById('changePasswordModal').classList.add('active');
            });
        }

        // Закрытие модалки пароля
        const closeBtn = document.getElementById('closePasswordModal');
        if (closeBtn) closeBtn.addEventListener('click', () => {
            document.getElementById('changePasswordModal').classList.remove('active');
        });

        const cancelBtn = document.getElementById('cancelPasswordBtn');
        if (cancelBtn) cancelBtn.addEventListener('click', () => {
            document.getElementById('changePasswordModal').classList.remove('active');
        });

        const modal = document.getElementById('changePasswordModal');
        if (modal) modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        // Отправка формы смены пароля
        const form = document.getElementById('changePasswordForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const current = document.getElementById('currentPassword').value;
                const newPass = document.getElementById('newPassword').value;
                const confirmPass = document.getElementById('confirmPassword').value;

                if (newPass.length < 6) {
                    UI.showToast('Новый пароль должен быть не менее 6 символов', 'error');
                    return;
                }
                if (newPass !== confirmPass) {
                    UI.showToast('Пароли не совпадают', 'error');
                    return;
                }

                try {
                    await API.request('/auth/change-password', {
                        method: 'POST',
                        body: JSON.stringify({
                            current_password: current,
                            new_password: newPass
                        })
                    });
                    UI.showToast('Пароль успешно изменён');
                    document.getElementById('changePasswordModal').classList.remove('active');
                } catch (error) {
                    UI.showToast('Ошибка: ' + error.message, 'error');
                }
            });
        }
    });
    </script>
</body>
</html>
