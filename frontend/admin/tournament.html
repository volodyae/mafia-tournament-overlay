<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление турниром</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .player-tag {
            background: var(--bg-secondary);
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .player-tag button {
            background: none;
            border: none;
            color: #EF4444;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
        }

        .form-input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid rgba(148,163,184,0.5);
            background: #020617;
            color: #E5E7EB;
            font-size: 14px;
        }

        .form-input::placeholder {
            color: #6B7280;
        }

        .player-search-results {
            max-height: 260px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid rgba(148,163,184,0.4);
            background: #020617;
            margin-top: 6px;
        }

        .player-search-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            font-size: 14px;
            border-bottom: 1px solid rgba(31,41,55,0.8);
        }

        .player-search-item:last-child {
            border-bottom: none;
        }

        .player-search-name {
            color: #E5E7EB;
        }

        .player-search-meta {
            color: #9CA3AF;
            font-size: 12px;
            margin-left: 6px;
        }

        .player-search-add {
            border: none;
            border-radius: 6px;
            background: #22C55E;
            color: #0F172A;
            font-weight: 600;
            font-size: 13px;
            padding: 4px 10px;
            cursor: pointer;
        }

        .player-search-empty {
            padding: 8px 10px;
            font-size: 13px;
            color: #9CA3AF;
        }

        .players-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0f172a;
            border-radius: 12px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(15,23,42,0.5);
            border: 1px solid rgba(148,163,184,0.2);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(148,163,184,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .modal-body {
            padding: 16px 20px 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #9CA3AF;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
        }

        @media (max-width: 640px) {
            .modal-content {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Навигация -->
        <nav class="navbar">
            <h1>🏆 Админ-панель Мафии</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Турниры</a>
                <a href="players.html" class="nav-link">Игроки</a>
                <a href="users.html" class="nav-link" id="usersLink" style="display:none;">Пользователи</a>
                <span style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
                    <span id="currentUser" style="color: var(--text-secondary); font-size: 14px;"></span>
                    <a href="#" class="nav-link" id="changePassLink">🔑</a>
                    <a href="#" class="nav-link" onclick="API.logout(); return false;">Выход</a>
                </span>
            </div>
        </nav>

        <!-- Главный контент -->
            <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h2 id="tournamentName">Загрузка...</h2>
                    <p id="tournamentMeta" style="color: var(--text-secondary); margin-top: 4px;"></p>
                </div>
                <button class="btn btn-secondary" id="manageAccessBtn" style="display: none;">🔐 Доступ</button>
            </div>

            <!-- Список игр турнира -->
            <div class="section">
                <h3 style="margin-bottom: 16px;">📊 Игры турнира</h3>
                <div id="gamesList" class="tournaments-list">
                    <!-- Заполняется через JS -->
                </div>
            </div>

            <!-- Участники турнира -->
            <div class="section" style="margin-top: 32px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h3>👥 Участники турнира (<span id="playersCount">0</span>)</h3>
                    <button class="btn btn-primary" id="managePlayers">Управление игроками</button>
                </div>
                <div id="tournamentPlayers" class="players-list">
                    <!-- Заполняется через JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно управления игроками -->
    <div id="managePlayersModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>👥 Управление игроками турнира</h3>
          <button class="close-btn" id="closePlayersModal">&times;</button>
        </div>
        <div class="modal-body">
          <!-- Поиск и добавление игроков -->
          <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Добавить игрока:</label>
            <input
              type="text"
              id="playerSearchInput"
              class="form-input"
              placeholder="Начните вводить ник или часть ника..."
              autocomplete="off">
            <div id="playerSearchResults" class="player-search-results">
              <!-- Строки поиска -->
            </div>
          </div>
          
          <!-- Список игроков турнира -->
          <div>
            <h4 style="margin-bottom: 12px;">Участники турнира (<span id="modalPlayersCount">0</span>)</h4>
            <div id="modalPlayersList" class="players-list">
              <!-- Список игроков -->
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Модальное окно управления доступом -->
    <div id="accessModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🔐 Доступ к турниру</h3>
          <button class="close-btn" id="closeAccessModal">&times;</button>
        </div>
        <div class="modal-body">
          <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 12px;">
            Отметьте пользователей, которым нужен доступ к управлению этим турниром.
          </p>
          <div id="accessUsersList" class="players-list" style="flex-direction: column; gap: 8px;">
            <!-- Список пользователей -->
          </div>
        </div>
      </div>
    </div>

    <!-- Модальное окно смены пароля -->
    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Смена пароля</h3>
                <button class="close-btn" id="closePasswordModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label>Текущий пароль:</label>
                        <input type="password" id="currentPassword" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Новый пароль:</label>
                        <input type="password" id="newPassword" class="form-input" placeholder="Мин. 6 символов" required>
                    </div>
                    <div class="form-group">
                        <label>Повторите новый пароль:</label>
                        <input type="password" id="confirmPassword" class="form-input" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelPasswordBtn">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сменить пароль</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/tournament.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = API.getUser();
        const el = document.getElementById('currentUser');
        if (el && user) el.textContent = user.username;

        const usersLink = document.getElementById('usersLink');
        if (usersLink && API.isSuperadmin()) usersLink.style.display = '';

        const changePassLink = document.getElementById('changePassLink');
        if (changePassLink) {
            changePassLink.addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                document.getElementById('changePasswordModal').classList.add('active');
            });
        }

        const closeBtn = document.getElementById('closePasswordModal');
        if (closeBtn) closeBtn.addEventListener('click', () => {
            document.getElementById('changePasswordModal').classList.remove('active');
        });

        const cancelBtn = document.getElementById('cancelPasswordBtn');
        if (cancelBtn) cancelBtn.addEventListener('click', () => {
            document.getElementById('changePasswordModal').classList.remove('active');
        });

        const modal = document.getElementById('changePasswordModal');
        if (modal) modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        const form = document.getElementById('changePasswordForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const current = document.getElementById('currentPassword').value;
                const newPass = document.getElementById('newPassword').value;
                const confirmPass = document.getElementById('confirmPassword').value;

                if (newPass.length < 6) {
                    UI.showToast('Новый пароль должен быть не менее 6 символов', 'error');
                    return;
                }
                if (newPass !== confirmPass) {
                    UI.showToast('Пароли не совпадают', 'error');
                    return;
                }

                try {
                    await API.request('/auth/change-password', {
                        method: 'POST',
                        body: JSON.stringify({
                            current_password: current,
                            new_password: newPass
                        })
                    });
                    UI.showToast('Пароль успешно изменён');
                    document.getElementById('changePasswordModal').classList.remove('active');
                } catch (error) {
                    UI.showToast('Ошибка: ' + error.message, 'error');
                }
            });
        }
    });
    </script>
</body>
</html>
